# Deterministic pre-commit gate. Arm with `uv run pre-commit install`.
# The gitleaks hook needs the binary: `brew install gitleaks`.
# These checks are deterministic facts (not LLM opinions), so they are
# allowed to BLOCK a commit — unlike the advisory RoboRev review, which
# only surfaces. A rare false positive gets a conscious inline suppression
# (`# type: ignore[...]` / `# noqa: ...`), never a bypass.
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff (format check)
        entry: uv run ruff format --check packages/
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff
        name: ruff (lint)
        entry: uv run ruff check packages/
        language: system
        pass_filenames: false
        always_run: true
      - id: mypy
        name: mypy (types)
        entry: uv run mypy packages/world/src/world packages/heroes/src/heroes packages/tick/src/tick packages/player-view/src/player_view packages/wire/src/wire
        language: system
        pass_filenames: false
        always_run: true
      - id: pytest
        name: pytest (tests)
        entry: uv run pytest packages/heroes/tests packages/world/tests packages/tick/tests packages/player-view/tests
        language: system
        pass_filenames: false
        always_run: true
      - id: web-typecheck
        name: tsc (web types)
        entry: npm --prefix packages/player-view-web run typecheck
        language: system
        pass_filenames: false
        always_run: true
      - id: web-eslint
        name: eslint (web lint)
        entry: npm --prefix packages/player-view-web run lint
        language: system
        pass_filenames: false
        always_run: true
      - id: web-vitest
        name: vitest (web tests)
        entry: npm --prefix packages/player-view-web run test
        language: system
        pass_filenames: false
        always_run: true
      - id: roborev-clean
        name: roborev (no open reviews on this branch)
        entry: ./scripts/roborev-clean-gate.sh
        language: system
        pass_filenames: false
        always_run: true
      - id: gitleaks
        name: gitleaks (staged secrets)
        entry: gitleaks protect --staged --redact
        language: system
        pass_filenames: false
        always_run: true

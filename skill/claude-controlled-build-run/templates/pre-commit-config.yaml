# Deterministic commit gate — FACTS block, opinions advise.
# Installed by `cbr.sh arm` as a SKELETON: replace the two placeholder hooks
# with your repo's real typecheck/format/lint/test commands, then run
# `pre-commit install`. The roborev-clean gate is the one hook you keep
# VERBATIM — it is the close-every-review law, mechanically enforced.

repos:
  - repo: local
    hooks:
      # EDIT ME: your typecheck/lint/format commands, always_run, fail closed.
      - id: typecheck
        name: types (EDIT ME)
        entry: sh -c 'echo "EDIT .pre-commit-config.yaml: wire your typecheck command" && exit 1'
        language: system
        pass_filenames: false
        always_run: true

      # EDIT ME: your test suite.
      - id: tests
        name: tests (EDIT ME)
        entry: sh -c 'echo "EDIT .pre-commit-config.yaml: wire your test command" && exit 1'
        language: system
        pass_filenames: false
        always_run: true

      # KEEP VERBATIM: the close-every-review gate.
      - id: roborev-clean
        name: roborev (no open reviews on this branch)
        entry: ./scripts/roborev-clean-gate.sh
        language: system
        pass_filenames: false
        always_run: true

      - id: gitleaks
        name: gitleaks (staged secrets)
        entry: gitleaks protect --staged --redact
        language: system
        pass_filenames: false
        always_run: true

# Deterministic commit gate — FACTS block, opinions advise.
# Installed by `cbr.sh arm` as a SKELETON: replace the two placeholder hooks
# with your repo's real typecheck/format/lint/test commands, then run
# `pre-commit install`. Per-commit reviews are advisory (2026-08-31 cadence
# move): the blocking review check rides the merge path, not this file.

# A merge that auto-commits fires ONLY pre-merge-commit — git has NO fallback
# to the pre-commit hook there — so both types must be installed or every
# commit-stage gate is silently bypassed on the primary merge path.
default_install_hook_types: [pre-commit, pre-merge-commit]
repos:
  - repo: local
    hooks:
      # EDIT ME: your typecheck/lint/format commands, always_run, fail closed.
      - id: typecheck
        name: types (EDIT ME)
        entry: sh -c 'echo "EDIT .pre-commit-config.yaml: wire your typecheck command" && exit 1'
        language: system
        pass_filenames: false
        always_run: true

      # EDIT ME: your test suite.
      - id: tests
        name: tests (EDIT ME)
        entry: sh -c 'echo "EDIT .pre-commit-config.yaml: wire your test command" && exit 1'
        language: system
        pass_filenames: false
        always_run: true

      # KEEP VERBATIM: the review wall at the merge boundary (per-commit
      # reviews are advisory). Needs scripts/merge-review-gate.sh installed
      # by `cbr.sh arm`; a non-merge commit exits 0 untouched.
      - id: merge-review-gate
        name: merge review gate (scripts/merge-review-gate.sh)
        entry: ./scripts/merge-review-gate.sh
        language: system
        pass_filenames: false
        always_run: true

      # KEEP VERBATIM: one fact, one record. The single-source law is only a
      # rule until something fails a commit for breaking it; edit
      # record-ownership.json to name YOUR records, never this hook.
      - id: record-single-source
        name: one fact, one record (scripts/record-single-source.sh)
        entry: ./scripts/record-single-source.sh
        language: system
        pass_filenames: false
        always_run: true

      - id: gitleaks
        name: gitleaks (staged secrets)
        entry: gitleaks protect --staged --redact
        language: system
        pass_filenames: false
        always_run: true
